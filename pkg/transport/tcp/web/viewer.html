<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{with .Name}}{{.}}{{else}}{{.ID}}{{end}} · tsterm</title>
<link rel="stylesheet" href="/static/tsterm.css">
</head>
<body class="viewer" data-role="{{.Role}}" data-share-url="{{.ShareURL}}" data-shared="{{if .Shared}}1{{end}}">
<header>
<a href="/" class="home">← sessions</a>
<nav id="tabs" aria-label="Recently active sessions"></nav>
<span id="status" class="dim">connecting…</span>
<button id="notify" type="button" hidden></button>
<button id="mode" type="button"></button>
<button id="closeended" type="button" hidden title="Close this ended session's tab. It's kept, in the session list.">✕ close</button>
{{with .ViewAs}}{{if .Other}}<button type="button" class="viewas other" data-viewas="owner" title="You're seeing what other people see; click to see it as the owner">👁 as others · back</button>{{else}}<button type="button" class="viewas" data-viewas="other" title="See this session as people other than you see it here">👁 as others</button>{{end}}{{end}}
<button id="menu" type="button" hidden aria-haspopup="menu" aria-expanded="false" title="More">☰</button>
<div id="menupop" role="menu" hidden></div>
</header>
<main class="oob"><div class="term"><div id="history" aria-label="History"></div><pre id="screen" class="screen" data-id="{{.ID}}" data-name="{{.Name}}"></pre><button id="cornerhandle" class="autofit" type="button" aria-label="Auto-fit" hidden>⇲</button></div></main>
<nav id="extrakeys" class="mobile" aria-label="Extra keys">
<button type="button" class="kbdtoggle" aria-label="Keyboard">⌨</button>
<button type="button" class="autofit" aria-label="Auto-fit">⇲</button>
<button type="button" data-key="esc">Esc</button>
<button type="button" data-key="tab">Tab</button>
<button type="button" data-key="ctrl" class="sticky">Ctrl</button>
<button type="button" data-key="alt" class="sticky">Alt</button>
<button type="button" data-key="left" aria-label="Left">←</button>
<button type="button" data-key="down" aria-label="Down">↓</button>
<button type="button" data-key="up" aria-label="Up">↑</button>
<button type="button" data-key="right" aria-label="Right">→</button>
<button type="button" data-key="pipe">|</button>
<button type="button" data-key="tilde">~</button>
<button type="button" data-key="slash">/</button>
<button type="button" data-key="dash">-</button>
</nav>
<textarea id="kbd" aria-label="Terminal input" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" rows="1"></textarea>
<div id="fitbar">
<button id="fitonce" type="button" title="Resize the session once to fit this window">fit once</button>
<button id="autofit" class="autofit" type="button">⇲ auto-fit</button>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="/static/common.js"></script>
<script src="/static/viewer.js"></script>
</body>
</html>
