<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{with .Name}}{{.}}{{else}}{{.ID}}{{end}} · tsterm</title>
<link rel="stylesheet" href="/static/tsterm.css">
</head>
<body class="viewer">
<header>
<a href="/" class="home">← sessions</a>
<span id="ident" class="rename" title="Double-click to rename"><b id="name">{{.Name}}</b> <code>{{.ID}}</code></span>
<span id="status" class="dim">connecting…</span>
<button id="mode" type="button"></button>
</header>
<nav id="tabs" aria-label="Recently active sessions"></nav>
<main class="oob"><div class="term"><pre id="screen" class="screen" data-id="{{.ID}}"></pre><button id="sizehandle" type="button" aria-label="Size to window">⇲</button></div></main>
<script src="/static/common.js"></script>
<script src="/static/viewer.js"></script>
</body>
</html>
