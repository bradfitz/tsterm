# Builds tsterm on each OS it runs on, including the Fyne GUI, which needs
# cgo and each OS's own toolkit (so macOS's can only be built on macOS),
# and runs the tests on Linux.
name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - run: go vet ./...
      - run: go test ./...

  gui:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Build tsterm-gui
        if: runner.os != 'Windows'
        run: go build -o tsterm-gui ./cmd/tsterm-gui
      - name: Build tsterm-gui (no console window)
        if: runner.os == 'Windows'
        run: go build -ldflags=-H=windowsgui -o tsterm-gui.exe ./cmd/tsterm-gui
      - name: Package tsterm.app
        if: runner.os == 'macOS'
        working-directory: cmd/tsterm-gui
        run: |
          go install fyne.io/tools/cmd/fyne@latest
          fyne package -os darwin -release
      - name: Build the CLI
        run: go build ./cmd/tsterm
